# Overrides on top of detekt's defaults (`buildUponDefaultConfig = true`). Every rule set here is
# switched on explicitly: detekt 2 changed which rules are active by default. The thresholds follow the
# Clean Code plugin's standards (fiftiesHousewife/Clean-Claude), tightened where noted: small
# methods, few parameters, low complexity and shallow nesting.

complexity:
  LongMethod:
    active: true
    allowedLines: 30
  LongParameterList:
    active: true
    # At most four parameters; data classes are exempt, as their constructor IS their shape.
    allowedFunctionParameters: 4
    allowedConstructorParameters: 4
    ignoreDataClasses: true
    ignoreDefaultParameters: false
  LargeClass:
    active: true
    allowedLines: 150
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 10
  NestedBlockDepth:
    active: true
    allowedDepth: 3
  ComplexCondition:
    active: true
    allowedConditions: 3
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 11
    allowedFunctionsPerClass: 11
    allowedFunctionsPerObject: 11
    allowedFunctionsPerEnum: 11
  StringLiteralDuplication:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']

style:
  # Gradle instantiates abstract task and extension classes and injects their abstract properties,
  # so "could be concrete" or "could be an interface" is wrong for nearly every class here.
  AbstractClassCanBeConcreteClass:
    active: false
  AbstractClassCanBeInterface:
    active: false
  # ktlint (through Spotless) enforces the same 120 columns, so the two never disagree.
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    # `?: return` / `if (...) return` at the top of a function is the clearest way to say
    # "not applicable", and the toolchain resolver contract is built on early `Optional.empty()`.
    excludeGuardClauses: true
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'log through Gradle, never stdout'
        value: 'kotlin.io.println'
      - reason: 'log through Gradle, never stdout'
        value: 'kotlin.io.print'
      - reason: 'rethrow or report; never print and carry on'
        value: 'kotlin.Throwable.printStackTrace'
      - reason: 'use java.nio.file, not legacy java.io streams'
        value: 'kotlin.io.inputStream'
      - reason: 'use java.nio.file, not legacy java.io streams'
        value: 'kotlin.io.outputStream'
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'java.io.FileInputStream'
        reason: 'use java.nio.file.Files'
      - value: 'java.io.FileOutputStream'
        reason: 'use java.nio.file.Files'
  ForbiddenComment:
    active: true

naming:
  # kotlin-dsl compiles Gradle's Action lambdas with SAM-with-receiver, so `tasks.register { … }`
  # has a receiver, not an `it`; detekt's type resolution doesn't know that and reports every inner
  # `it` as shadowing one that doesn't exist.
  NoNameShadowing:
    active: false
  FunctionNaming:
    active: true
    # Names say what a function returns or changes, never handle/process/do/perform. Backtick test
    # names are a sentence describing the behaviour under test.
    functionPattern: '(?!handle|process|perform|do[A-Z])[a-z][a-zA-Z0-9]*'
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']
  ForbiddenClassName:
    active: true
    forbiddenName: ['*Helper', '*Util', '*Utils', '*Manager', '*Processor']

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

performance:
  SpreadOperator:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']

# The repository's own rules (detekt-rules). detekt's LargeClass counts one class's code only, and
# nothing limits comments: files stay small, and comments say why, not what.
source-file:
  FileLength:
    active: true
    allowedLines: 200
  CommentDensity:
    active: true
    allowedPercent: 15
    minLines: 30
    # Tests carry no comments at all. The DSL types users configure are exempt: their KDoc is the
    # published reference for each setting (Dokka, and the IDE while writing javaApp { … }).
    excludes:
      - '**/test/**'
      - '**/testFixtures/**'
      - '**/functionalTest/**'
      - '**/*Extension.kt'
      - '**/*RuntimeSecurity.kt'
      - '**/JavaRuntimeDefaults.kt'
      - '**/RpmPackaging.kt'
      - '**/EmbeddedRuntimeSettings.kt'
