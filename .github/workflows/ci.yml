# CI for the plugin itself: compile, functional tests (real Gradle builds of Java and Node
# fixtures), then build both samples end to end on Linux, macOS and Windows. The Windows leg is
# the native, no-WSL2 path: .bat launchers, node.exe, and smoke tests through cmd.exe.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 17 is the toolchain the plugin itself compiles against; 21 runs Gradle and is what the
          # samples embed. Gradle 9 itself requires 17 or newer.
          java-version: |
            17
            21
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - if: success() || failure()
        run: python3 .github/scripts/annotate-test-failures.py
      - run: ./gradlew -p samples/java-service build
      # The sample's RPM, installed with dnf in a clean Rocky Linux 9 container, started and removed.
      - if: runner.os == 'Linux'
        run: .github/scripts/verify-rpm.sh samples/java-service/build/distributions/java-service-1.0.0-1.x86_64.rpm
      - run: ./gradlew -p samples/node-service build
      - run: ./gradlew -p samples/spring-boot-service build
      # Builds and runs the container image where Docker runs Linux containers; skipped elsewhere.
      # On Linux it is required, so a green run proves (with Testcontainers) that the container starts,
      # answers its probes, is labelled and stops on SIGTERM.
      - if: runner.os != 'Linux'
        run: ./gradlew -p samples/docker-service build
      - if: runner.os == 'Linux'
        run: ./gradlew -p samples/docker-service build -PdockerRequired=true
      # The same context builds the arm64 image on this x64 runner without emulation: nothing runs
      # while building, so the arm64 archive is only copied in.
      - if: runner.os == 'Linux'
        run: docker buildx build --platform linux/arm64 --tag docker-service:arm64 samples/docker-service/build/docker-context
      # The post-edit hook shared by Claude Code, Copilot and Devin, called as each calls it.
      - if: runner.os == 'Linux'
        run: .github/scripts/test-agent-hooks.sh
