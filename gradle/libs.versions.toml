# One catalogue for the whole repository. `plugins` reads it via
# `from(files("../gradle/libs.versions.toml"))`, so there is a single place to bump a version.
[versions]
junit = "6.1.3"
ktlint = "1.8.0"

plugin-publish = "2.2.1"
maven-publish = "0.37.0"
versions = "0.66.0"
spotless = "8.10.4"
detekt = "2.0.0-alpha.6"
forbiddenapis = "3.11"
dokka = "2.2.0"
cyclonedx = "13.4.0"
packageurl = "1.5.0"
redline = "1.2.10"
commons-compress = "1.28.0"
xz = "1.12"
zstd-jni = "1.5.7-24"
bouncycastle = "1.86"
# Verifies Sigstore bundles in app-smoke-test, in an isolated worker resolved only when asked for.
sigstore = "2.3.0"

# Used by samples/spring-boot-service only.
spring-boot = "4.1.2"

# The build's own tools.
# Runs Renovate's config validator on renovate/ (validateRenovatePresets, part of check), with the
# Node.js pinned below; Renovate's own version is in tools/renovate-validator/package.json.
gradle-node-plugin = "7.1.0"
jacoco = "0.8.15"
# Bytecode level of the plugins: Gradle 9 runs on Java 17 or newer.
plugin-jvm = "17"

# ---------------------------------------------------------------------------------------------------
# What the plugins embed. Not dependencies of this build: the java-app and node-app builds write
# these into jdks.properties and node.properties inside the plugin jars, so bumping a pin here and
# releasing the plugins rolls a runtime patch out to every repository. Users override a pin with
# javaApp.jdk.<feature> or nodeApp.node.version.
#
# A pin must resolve on every supported target: vendors upload a release one OS and CPU at a time
# over several days, so the newest complete release can lag the newest announced one. Check for
# newer CPU / security releases before publishing (checked 2026-10-26: Node.js moved to the
# 2026-10-20 security release; the October JDK CPU builds are not yet on every target, e.g. Temurin
# 21.0.13+9 has no Windows x64 build, so the JDK pins stay):
#   Temurin:    https://adoptium.net/temurin/releases/
#   Oracle:     https://www.oracle.com/java/technologies/downloads/archive/
#   Corretto:   https://github.com/corretto/corretto-21/releases (one repository per feature)
#   Zulu:       https://www.azul.com/downloads/?package=jdk#zulu
#   Liberica:   https://github.com/bell-sw/Liberica/releases
#   Microsoft:  https://learn.microsoft.com/java/openjdk/older-releases
#   SapMachine: https://github.com/SAP/SapMachine/releases
#   Node.js:    https://nodejs.org/en/about/previous-releases
#
# jdk-<distribution>-<feature>; the feature releases offered are the ones pinned (11 to 27).
# Microsoft builds long-term-support releases only (no 26 or 27); Temurin 27 and SapMachine 25+ have
# no Intel Mac (mac-x64) build. Pins as of 2026-10-25 were checked to exist on every other target.
jdk-default = "21"
jdk-temurin-11 = "11.0.32.1+1"
jdk-temurin-17 = "17.0.20.1+1"
jdk-temurin-21 = "21.0.12.1+1"
jdk-temurin-25 = "25.0.4.1+1"
jdk-temurin-26 = "26.0.2.1+1"
jdk-temurin-27 = "27+35"
jdk-oracle-17 = "17.0.12"
jdk-oracle-21 = "21.0.12"
jdk-oracle-25 = "25.0.3"
jdk-oracle-26 = "26.0.2"
jdk-oracle-27 = "27.0.1"
jdk-corretto-11 = "11.0.33.0.9"
jdk-corretto-17 = "17.0.21.0.10"
jdk-corretto-21 = "21.0.13.0.10"
jdk-corretto-25 = "25.0.5.0.9"
jdk-corretto-26 = "26.0.2.11.1"
jdk-corretto-27 = "27.0.1.0.10"
jdk-zulu-11 = "11.92.109-ca-jdk11.0.33"
jdk-zulu-17 = "17.70.111-ca-jdk17.0.21"
jdk-zulu-21 = "21.54.107-ca-jdk21.0.13"
jdk-zulu-25 = "25.38.107-ca-jdk25.0.5"
jdk-zulu-26 = "26.32.203-ca-jdk26.0.2.1"
jdk-zulu-27 = "27.30.107-ca-jdk27.0.1"
jdk-liberica-11 = "11.0.33+11"
jdk-liberica-17 = "17.0.21+11"
jdk-liberica-21 = "21.0.13+11"
jdk-liberica-25 = "25.0.5+11"
jdk-liberica-26 = "26.0.2.1+1"
jdk-liberica-27 = "27.0.1.0.2+5"
jdk-microsoft-11 = "11.0.32"
jdk-microsoft-17 = "17.0.20"
jdk-microsoft-21 = "21.0.12"
jdk-microsoft-25 = "25.0.4"
jdk-sapmachine-17 = "17.0.20"
jdk-sapmachine-21 = "21.0.13"
jdk-sapmachine-25 = "25.0.5"
jdk-sapmachine-26 = "26.0.2"
jdk-sapmachine-27 = "27.0.1.0.2"
node = "24.22.1"
# The generated Dockerfile's default base image (registry.access.redhat.com/ubi9/ubi-minimal), by the
# tag of one rebuild (9.<minor>-<build>; Red Hat moves plain 9.<minor> to each new one) and by the
# digest of its multi-arch index, so every build of a release starts from the same bytes. Bump both
# together: the digest is the Docker-Content-Digest of
#   https://registry.access.redhat.com/v2/ubi9/ubi-minimal/manifests/<tag> (pins as of 2026-10-27)
ubi-minimal-tag = "9.8-1793050346"
ubi-minimal-digest = "sha256:6f3a78179e0b30b930a186e7f68a4af52e51bb82406c9653be10bddd624e40f5"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
cyclonedx-core = { module = "org.cyclonedx:cyclonedx-core-java", version.ref = "cyclonedx" }
packageurl = { module = "com.github.package-url:packageurl-java", version.ref = "packageurl" }
# Redline writes RPMs in plain Java; its own dependencies are old, so the build pins current ones.
redline = { module = "org.redline-rpm:redline", version.ref = "redline" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
bouncycastle-pg = { module = "org.bouncycastle:bcpg-jdk18on", version.ref = "bouncycastle" }
sigstore-java = { module = "dev.sigstore:sigstore-java", version.ref = "sigstore" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
# Gradle plugins applied from build-logic/conventions, as ordinary dependencies.
gradle-plugin-publish = { module = "com.gradle.plugin-publish:com.gradle.plugin-publish.gradle.plugin", version.ref = "plugin-publish" }
gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
gradle-versions = { module = "io.github.ben-manes.versions:io.github.ben-manes.versions.gradle.plugin", version.ref = "versions" }
gradle-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
gradle-detekt = { module = "dev.detekt:dev.detekt.gradle.plugin", version.ref = "detekt" }
gradle-forbiddenapis = { module = "de.thetaphi:forbiddenapis", version.ref = "forbiddenapis" }
gradle-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
gradle-node = { id = "com.github.node-gradle.node", version.ref = "gradle-node-plugin" }
