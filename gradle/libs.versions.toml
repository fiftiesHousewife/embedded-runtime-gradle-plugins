# One catalogue for the whole repository. `build-src` reads it via
# `from(files("../gradle/libs.versions.toml"))`, so there is a single place to bump a version.
[versions]
junit = "6.1.3"
ktlint = "1.8.0"

plugin-publish = "2.2.1"
versions = "0.66.0"
spotless = "8.9.0"
detekt = "1.23.8"

[plugins]
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
