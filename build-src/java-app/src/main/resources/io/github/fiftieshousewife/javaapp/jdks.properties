# Approved JDK pins. Bump these (and release the plugin) to roll a JDK patch out to every
# repository. Overridable per machine or project with javaApp.jdk.<feature>.
#
# Supported Java feature releases are 11 to 25: app runtimes are built with jlink, so the JDK
# must be modular. Add a pin here to make another release available.
#
# Keys are jdk.<distribution>.<feature>, falling back to jdk.<feature>. The distribution is chosen
# with javaApp.jdk.distribution (temurin by default).
#
# Pins as of 2026-10-24; check for newer CPU / security releases before publishing:
#   Temurin:    https://adoptium.net/temurin/releases/
#   Oracle:     https://www.oracle.com/java/technologies/downloads/archive/
#   Corretto:   https://github.com/corretto/corretto-21/releases (one repository per feature)
#   Zulu:       https://www.azul.com/downloads/?package=jdk#zulu
#   Liberica:   https://github.com/bell-sw/Liberica/releases
#   Microsoft:  https://learn.microsoft.com/java/openjdk/older-releases
#   SapMachine: https://github.com/SAP/SapMachine/releases
jdk.default=21

# A pin must resolve on every supported target. Vendors upload a new release one OS and CPU at a
# time over several days, so the newest complete release can lag the newest announced one.
jdk.temurin.11=11.0.32.1+1
jdk.temurin.17=17.0.20.1+1
jdk.temurin.21=21.0.12.1+1
jdk.temurin.25=25.0.4.1+1

# Oracle versions carry no build number. The 17 and 21 lines stop at .12: later patches moved behind
# the OTN licence and are not in the free archive, so check the licence of whatever you pin here.
jdk.oracle.17=17.0.12
jdk.oracle.21=21.0.12
jdk.oracle.25=25.0.3

# Corretto adds Amazon's own build and revision: five parts, no '+'.
jdk.corretto.11=11.0.33.0.9
jdk.corretto.17=17.0.21.0.10
jdk.corretto.21=21.0.13.0.10
jdk.corretto.25=25.0.5.0.9

# Zulu pins name Azul's version and the OpenJDK version together, as in Azul's file names.
jdk.zulu.11=11.92.109-ca-jdk11.0.33
jdk.zulu.17=17.70.111-ca-jdk17.0.21
jdk.zulu.21=21.54.107-ca-jdk21.0.13
jdk.zulu.25=25.38.107-ca-jdk25.0.5

jdk.liberica.11=11.0.33+11
jdk.liberica.17=17.0.21+11
jdk.liberica.21=21.0.13+11
jdk.liberica.25=25.0.5+11

# Microsoft publishes a quarter's patches some days after the others; these are the July builds.
jdk.microsoft.11=11.0.32
jdk.microsoft.17=17.0.20
jdk.microsoft.21=21.0.12
jdk.microsoft.25=25.0.4

# SapMachine 11 is out of support, and SapMachine 25 has no Intel macOS build (mac-x64).
jdk.sapmachine.17=17.0.20
jdk.sapmachine.21=21.0.13
jdk.sapmachine.25=25.0.5
