org.gradle.configuration-cache=true
org.gradle.caching=true
# Never fall back to a JDK that happens to be installed on the machine: provision the pinned one.
org.gradle.java.installations.auto-detect=false
# The plugin build is compiled from source inside this sample, which needs more than the default heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
# The skills these plugins install live in ai/ in this repository.
javaApp.aiSkills=false
# Oracle JDK, whose No-Fee Terms and Conditions let an app's archive carry it.
javaApp.jdk.distribution=oracle
javaApp.jdk.25=25.0.3
