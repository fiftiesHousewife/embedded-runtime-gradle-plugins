# The shared runtime module sets: each app's runtime is the smallest set (fewest modules) that holds
# every module it needs, so apps on the same set, JDK and target ship byte-identical runtimes that
# container registries and nodes store and pull once. An app no set covers gets exactly its own
# modules. Builds replace or add sets with javaApp { moduleSets }, or turn them off with
# javaApp.sharedModuleSets=false.
#
# set.<name> = modules, comma-separated. Keep to modules every supported release (11 to 27) has, and
# never a debugging or attach module (javaApp.security.forbiddenModules): a set holding a forbidden
# module is skipped. Sizes are of a Java 21 runtime linked with the plugin's options, on macOS.

# 30 MB: the JDK's own HTTP server is the only extra a plain service usually needs.
set.base = java.base, jdk.httpserver

# 38 MB: HTTP clients and servers, JSON and XML, JDBC, JNDI, TLS.
set.service = java.base, java.logging, java.naming, java.net.http, java.xml, jdk.httpserver, \
  jdk.unsupported, jdk.charsets, jdk.zipfs, jdk.crypto.ec, java.sql, java.transaction.xa, \
  java.management, java.security.jgss, java.security.sasl, jdk.naming.dns

# 54 MB: what Spring Boot, Quarkus and Micronaut apps reach for (java.beans pulls in java.desktop).
set.framework = java.base, java.logging, java.naming, java.net.http, java.xml, jdk.httpserver, \
  jdk.unsupported, jdk.charsets, jdk.zipfs, jdk.crypto.ec, java.sql, java.transaction.xa, \
  java.management, java.security.jgss, java.security.sasl, jdk.naming.dns, java.compiler, \
  java.datatransfer, java.desktop, java.instrument, java.prefs, java.scripting, jdk.jfr, \
  jdk.management, java.rmi, java.management.rmi

# 66 MB: everything a server might load by name: locales, JFR streaming, Kerberos, PKCS#11.
set.server = java.base, java.logging, java.naming, java.net.http, java.xml, jdk.httpserver, \
  jdk.unsupported, jdk.charsets, jdk.zipfs, jdk.crypto.ec, java.sql, java.transaction.xa, \
  java.management, java.security.jgss, java.security.sasl, jdk.naming.dns, java.compiler, \
  java.datatransfer, java.desktop, java.instrument, java.prefs, java.scripting, jdk.jfr, \
  jdk.management, java.rmi, java.management.rmi, jdk.localedata, jdk.management.jfr, \
  jdk.security.auth, jdk.security.jgss, jdk.net, java.xml.crypto, java.sql.rowset, jdk.crypto.cryptoki

# lastFeature.<module> = the last Java release the sets keep it for. Java 22 moved the EC provider
# into java.base, leaving jdk.crypto.ec empty.
lastFeature.jdk.crypto.ec = 21
