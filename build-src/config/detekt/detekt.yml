# Overrides on top of detekt's defaults (`buildUponDefaultConfig = true`). The thresholds follow the
# Clean Code plugin's standards (fiftiesHousewife/Clean-Claude), tightened where noted: small
# methods, few parameters, low complexity and shallow nesting.

complexity:
  LongMethod:
    threshold: 30
  LongParameterList:
    # At most four parameters; data classes are exempt, as their constructor IS their shape.
    functionThreshold: 5
    constructorThreshold: 5
    ignoreDataClasses: true
    ignoreDefaultParameters: false
  LargeClass:
    threshold: 150
  CyclomaticComplexMethod:
    threshold: 10
  CognitiveComplexMethod:
    active: true
    threshold: 10
  NestedBlockDepth:
    threshold: 3
  ComplexCondition:
    threshold: 3
  TooManyFunctions:
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
  StringLiteralDuplication:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']

style:
  # ktlint (through Spotless) enforces the same 120 columns, so the two never disagree.
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # `?: return` / `if (...) return` at the top of a function is the clearest way to say
    # "not applicable", and the toolchain resolver contract is built on early `Optional.empty()`.
    excludeGuardClauses: true
  MagicNumber:
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'log through Gradle, never stdout'
        value: 'kotlin.io.println'
      - reason: 'log through Gradle, never stdout'
        value: 'kotlin.io.print'
      - reason: 'rethrow or report; never print and carry on'
        value: 'kotlin.Throwable.printStackTrace'
      - reason: 'use java.nio.file, not legacy java.io streams'
        value: 'kotlin.io.inputStream'
      - reason: 'use java.nio.file, not legacy java.io streams'
        value: 'kotlin.io.outputStream'
  ForbiddenImport:
    active: true
    imports:
      - value: 'java.io.FileInputStream'
        reason: 'use java.nio.file.Files'
      - value: 'java.io.FileOutputStream'
        reason: 'use java.nio.file.Files'
  ForbiddenComment:
    active: true

naming:
  FunctionNaming:
    # Names say what a function returns or changes, never handle/process/do/perform. Backtick test
    # names are a sentence describing the behaviour under test.
    functionPattern: '(?!handle|process|perform|do[A-Z])[a-z][a-zA-Z0-9]*'
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']
  ForbiddenClassName:
    active: true
    forbiddenName: ['*Helper', '*Util', '*Utils', '*Manager', '*Processor']

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

performance:
  SpreadOperator:
    excludes: ['**/test/**', '**/testFixtures/**', '**/functionalTest/**']
